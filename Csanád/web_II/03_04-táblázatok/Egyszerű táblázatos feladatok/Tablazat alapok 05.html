<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vegyjelek</title>
</head>
<style>
    td,th{
        padding: 0.3em;
    }
    th{
        text-align: center;
        font-weight: bold;
        background-color: rgb(175, 175, 175);
    }
</style>
<body>
    <table border="1px solid black" style="border-collapse: collapse;">
        <caption>A táblázat neve</caption>
        <thead>
            <tr>
                <th>#</th>
                <th>A</th>
                <th>B</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>A1</td>
                <td>B1</td>
            </tr>
            <tr>
                <td>2</td>
                <td>A2</td>
                <td>B2</td>
            </tr>
            <tr>
                <td>3</td>
                <td>A3</td>
                <td>B3</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>Össz:</th>
                <th>össz A</th>
                <th>össz B</th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
