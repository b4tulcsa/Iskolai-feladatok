<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Táblázat alapok</title>
</head>
<body>
    <table border="1px solid black" style="border-collapse: collapse;">
        <caption>A táblázat neve</caption>
        <thead>
            <tr>
                <th>1</th>
                <th>2</th>
                <th>3</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>4</td>
                <td colspan="2">5</td>
            </tr>
            <tr>
                <td>7</td>
                <td rowspan="2">8</td>
                <td>9</td>
            </tr>
            <tr>
                <td>10</td>
                <td>12</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>13</td>
                <td>14</td>
                <td>15</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
