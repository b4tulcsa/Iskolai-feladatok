<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>téglalap</h1>
    <p>Hozz létre egy teglalap.html nevű állományt, amelynek segítségével határozd meg egy 10 cm széles és 5 cm magas téglalap kerületének és területének nagyságát! Írasd ki a weboldalra a két oldalra vonatkozó információt és a két eredményt is esztétikus módon!</p>

    <script>
        const sz = 10.5976, m = 5.3616

        //math = matematikai függvények, konstansok gyüjteménye
        //math.parameter
        //kerekites: math.round(valtozo)
        
        let k = 2 * Math.round((sz + m)), t = Math.round(sz * m)
        document.write(`a téglalap kerülete ${k} a területe ${t} cm <sup>2</sup>`)
    </script>

</body>
</html>
