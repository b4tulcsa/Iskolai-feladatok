<script>
    let penz = parseInt(prompt("mennyi pénzünk van: "))
    let termek = parseInt(prompt("mi a termék neve: "))
    let egysegar = parseInt(prompt("mennyi a termék egységára: "))
    let darab = parseInt(prompt("hány terméket vásárlunk: "))
    
    //console.log(penz,darab,egysegar)

    document.write(`a ${darab} megnnyiségű ${termek} megvétele után a megmaradt pénzünk ${penz-egysegar*darab} a fizetés mennyisége ${penz-penz-egysegar*darab}Ft`)
</script>
